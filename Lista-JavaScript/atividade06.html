<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 06</title>
</head>

<body>
    <script>
        let A = [1, 2, 3, 4, 5]; 
        let B = [4, 5, 6, 7];

        let inter = [];
        let uniao = [];
        let diff = [];
        let indexInter = 0, indexUniao = 0, indexDiff = 0;

        // 1. Copiando A para União e checando Interseção e Diferença
        for (let i = 0; i < A.length; i++) {
            uniao[indexUniao] = A[i];
            indexUniao++;
            
            let pertenceAB = false;
            for (let j = 0; j < B.length; j++) {
                if (A[i] === B[j]) {
                    pertenceAB = true;
                    inter[indexInter] = A[i]; 
                    indexInter++;
                    break;
                }
            }
            if (!pertenceAB) {
                diff[indexDiff] = A[i]; 
                indexDiff++;
            }
        }

        // 2. Adicionando elementos de B na União que não estão em A
        for (let j = 0; j < B.length; j++) {
            let pertenceAA = false;
            for (let i = 0; i < A.length; i++) {
                if (B[j] === A[i]) {
                    pertenceAA = true;
                    break;
                }
            }
            if (!pertenceAA) {
                uniao[indexUniao] = B[j];
                indexUniao++;
            }
        }

        //3 Checando se A é subconjunto de B
        let aSubB = true;
        for (let i = 0; i < A.length; i++) {
            let encontrou = false;
            for (let j = 0; j < B.length; j++) {
                if (A[i] === B[j]) {
                    encontrou = true;
                    break;
                }
            }
            if (!encontrou) {
                aSubB = false;
                break;
            }
        }

        //4 Checando se B é subconjunto de A
        let bSubA = true;
        for (let j = 0; j < B.length; j++) {
            let encontrou = false;
            for (let i = 0; i < A.length; i++) {
                if (B[j] === A[i]) {
                    encontrou = true;
                    break;
                }
            }
            if (!encontrou) {
                bSubA = false;
                break;
            }
        }

        document.write("<strong>Vetor A:</strong> [" + A + "]<br>");
        document.write("<strong>Vetor B:</strong> [" + B + "]<br><br>");
        
        document.write("<strong>A ∩ B (Interseção):</strong> [" + inter + "]<br>");
        document.write("<strong>A U B (União):</strong> [" + uniao + "]<br>");
        document.write("<strong>A - B (Diferença):</strong> [" + diff + "]<br><br>");

        if (aSubB) {
            document.write("A é subconjunto de B<br>");
        } else {
            document.write("A NÃO é subconjunto de B<br>");
        }

        if (bSubA) {
            document.write("B é subconjunto de A<br>");
        } else {
            document.write("B NÃO é subconjunto de A<br>");
        }
    </script>
</body>

</html>
