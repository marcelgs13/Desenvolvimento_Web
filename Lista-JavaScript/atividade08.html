<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 08</title>
</head>
<body>
    <script>
        let base = prompt("Digite a base do número:") * 1;
        let expoente = prompt("Digite o expoente:") * 1;
        let resultado = 1;
        

        let limiteLoop = expoente;
        
        if (expoente < 0) {
            limiteLoop = expoente * -1;
        }
        for (let i = 1; i <= limiteLoop; i++) {
            resultado *= base;
        }
        if (expoente < 0) {
            resultado = 1 / resultado;
        }
        document.write("<strong>Base:</strong> " + base + "<br>");
        document.write("<strong>Expoente:</strong> " + expoente + "<br>");
        document.write("<strong>Resultado:</strong> " + resultado);
    </script>
</body>
</html>
