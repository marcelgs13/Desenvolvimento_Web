<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 01</title>
</head>
<body>
    <script>
        let jogador1 = "Darkseid";
        let jogador2 = "Fênix";
        let pontosJ1 = 0;
        let pontosJ2 = 0;

        // Sorteia 0 para par e 1 para ímpar
        let sorteio = Math.floor(Math.random() * 2);
        let defensor = (sorteio === 0) ? jogador1 : jogador2;

        console.log("O defensor é: " + defensor);

        for (let i = 0; i < 3; i++) {
          
            let dadoJ1 = Math.floor(Math.random() * 6) + 1;
            let dadoJ2 = Math.floor(Math.random() * 6) + 1;
            
            if (dadoJ1 > dadoJ2) {
                pontosJ1++;
            } else if (dadoJ2 > dadoJ1) {
                pontosJ2++;
            } else { 
                if (defensor === jogador1) pontosJ1++;
                else pontosJ2++;
            }
        }

        document.write("<h1>Combate entre Darkseid e Fênix</h1>");
        document.write("O defensor é o " + defensor + "<br>");
        document.write("Pontos de " + jogador1 + ": " + pontosJ1 + "<br>");
        document.write("Pontos de " + jogador2 + ": " + pontosJ2 + "<br>");
        document.write("O vencedor é: " + ((pontosJ1 > pontosJ2) ? jogador1 : jogador2));
    </script>
</body>
</html>
